apiVersion: v1
kind: ConfigMap
metadata:
  name: env
data:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: enabled
  RAILS_SERVE_STATIC_FILES: enabled
  # Enable these once Postgres (pg gem + database) and Redis exist.
  # The app currently uses SQLite, and a postgresql:// URL makes Rails crash on boot.
  # DATABASE_URL: postgresql://example.com/mydb
  # REDIS_URL: redis://redis.default.svc.cluster.local:6379/
